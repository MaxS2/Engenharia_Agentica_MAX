# ============================================================
# Cloud Build - PPTNC Poke Deck
# Build + push das imagens (Backend e Frontend) no Artifact
# Registry e deploy no Cloud Run (us-east1, projeto pptnc-stage).
# ============================================================
#
# Substituicoes esperadas (definidas no Trigger ou em --substitutions):
#   _REGION          regiao do Cloud Run                (default us-east1)
#   _REPO            repositorio no Artifact Registry   (default pptnc-pokedeck)
#   _BACKEND_SVC     nome do servico backend            (default backend-service)
#   _FRONTEND_SVC    nome do servico frontend           (default frontend-service)
#   _SERVICE_ACCOUNT email da service account runtime   (default pokedeck-runner@$PROJECT_ID.iam.gserviceaccount.com)
#   _GCS_BUCKET      bucket do Cloud Storage FUSE       (default pptnc-stage-pokedeck-db)
#   _JWT_SECRET      segredo JWT (preferir Secret Manager em producao)
#   _CORS_ORIGINS    origens permitidas para CORS do frontend

substitutions:
  _REGION: us-east1
  _REPO: pptnc-pokedeck
  _BACKEND_SVC: backend-service
  _FRONTEND_SVC: frontend-service
  _SERVICE_ACCOUNT: pokedeck-runner@${PROJECT_ID}.iam.gserviceaccount.com
  _GCS_BUCKET: pptnc-stage-pokedeck-db
  _JWT_SECRET: CHANGE_ME
  _CORS_ORIGINS: "*"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---------- Backend ----------
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest
      - ./codebase/backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SVC}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}
      - --max-instances=1
      - --port=8080
      - --add-volume=name=pokedeck-db,type=cloud-storage,bucket=${_GCS_BUCKET}
      - --add-volume-mount=volume=pokedeck-db,mount-path=/data
      - --set-env-vars=SPRING_DATASOURCE_URL=jdbc:sqlite:/data/pokedeck.db,JWT_SECRET=${_JWT_SECRET},JWT_EXPIRATION=86400000,CORS_ALLOWED_ORIGINS=${_CORS_ORIGINS}

  # ---------- Frontend ----------
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["deploy-backend"]
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://${_BACKEND_SVC}-${PROJECT_NUMBER}.${_REGION}.run.app/api/v1
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest
      - ./codebase/frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SVC}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --set-env-vars=NEXT_PUBLIC_API_URL=https://${_BACKEND_SVC}-${PROJECT_NUMBER}.${_REGION}.run.app/api/v1

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest
