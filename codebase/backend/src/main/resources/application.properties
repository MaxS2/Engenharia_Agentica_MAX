spring.application.name=pokedeck-backend
server.port=8080

# ---------- Datasource (SQLite) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:data/pokedeck.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method

# ---------- JWT (consumido a partir da Sprint 4) ----------
pokedeck.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
pokedeck.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---------- Cookie HttpOnly (Sprint 10) ----------
pokedeck.auth.cookie.name=${AUTH_COOKIE_NAME:pokedeck-session}
pokedeck.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
pokedeck.auth.cookie.same-site=${AUTH_COOKIE_SAMESITE:Strict}
pokedeck.auth.cookie.path=${AUTH_COOKIE_PATH:/}

# ---------- CORS ----------
pokedeck.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- PokeAPI (Sprint 6) ----------
pokedeck.pokeapi.base-url=${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}

# ---------- Admin seeding (Sprint 4) ----------
pokedeck.admin.username=${ADMIN_USERNAME:admin}
pokedeck.admin.password=${ADMIN_PASSWORD:admin}

# ---------- Logging ----------
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.pptnc=INFO
