services:
  backend:
    build:
      context: ./codebase/backend
      dockerfile: Dockerfile
    image: pptnc-pokedeck-backend:dev
    container_name: pptnc-pokedeck-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:sqlite:/data/pokedeck.db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./codebase/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    image: pptnc-pokedeck-frontend:dev
    container_name: pptnc-pokedeck-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pokedeck-session}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
